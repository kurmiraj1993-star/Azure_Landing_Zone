# name: Azure Infrastructure Deployment

on:
  push:
    branches:
      - main
      - feature/**

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    name: Terraform Infrastructure

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environment/dev

    env:
      # ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      # ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: "80f9819c-5a7b-4a8c-9fee-c379a864a6fb"
      ARM_TENANT_ID: "39d3196b-7780-4e40-bc6f-1ad0907ddfac"
      ARM_SUBSCRIPTION_ID: "4548392c-1285-427f-ab2d-deed87c2d4a0"
      ARM_USE_OIDC: true

    steps:

      # Step 1: Checkout Repository

      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 3: Terraform Version

      - name: Terraform Version
        run: terraform version

      # Step 4: Terraform Init

      - name: Terraform Init
        run: terraform init

      # Step 5: Terraform Format

      # - name: Terraform Format
      #   run: terraform fmt -check -recursive

      # Step 6: Terraform Validate

      - name: Terraform Validate
        run: terraform validate

      # Step 7: Terraform Plan

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 8: Terraform Apply

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy plan
        run:  terraform plan -destroy -out=destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -auto-approve destroy.tfplan 