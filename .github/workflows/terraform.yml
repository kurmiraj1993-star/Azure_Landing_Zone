name: Azure Infrastructure Deployment

on:
  push:
    branches:
      - main
      - feature/**

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  terraform:

    name: Terraform Infrastructure

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./environment/dev

    env:
      # ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      # ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_CLIENT_ID: "74b9e77e-27c8-463c-8988-1abe7b37c8dc"
      ARM_TENANT_ID: "a3f64c6f-ee3d-499e-876d-c6c5cac2b026"
      ARM_SUBSCRIPTION_ID: "42ce087e-50f5-4f13-901d-04d743c08316"
      ARM_USE_OIDC: true

    steps:

      # Step 1: Checkout Repository

      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Step 3: Terraform Version

      - name: Terraform Version
        run: terraform version

      # Step 4: Terraform Init

      - name: Terraform Init
        run: terraform init

      # Step 5: Terraform Format

      # - name: Terraform Format
      #   run: terraform fmt -check -recursive

      # Step 6: Terraform Validate

      - name: Terraform Validate
        run: terraform validate

      # Step 7: Terraform Plan

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      # Step 8: Terraform Apply

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan